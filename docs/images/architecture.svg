<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 770" width="1040" height="770" role="img" aria-labelledby="t d">
<title id="t">aws-genai-iac architecture</title>
<desc id="d">How aws-genai-iac works. A change, made by a human or a coding agent, passes agent guards, then gates (ruff, mypy, pytest, checkov and gitleaks), then a plan that is read before apply under an exec role with a permissions boundary, then verification against live AWS. It provisions one AWS account with no public ingress: operators reach private hosts through SSM port-forwarding. Three application tiers (MacroRAG, XbrlRag with RDS Postgres, and Faultline) and an ingest runner call shared services: RagInference on ECS Fargate and a Qdrant vector store, found through Cloud Map private DNS. Below them sit data and security (S3, ECR, a KMS customer-managed key and Secrets Manager) and networking (a VPC, an S3 gateway endpoint, a scheduled NAT instance and security groups). Alongside, EventBridge daily windows, a single park-mode flag, scheduler alarms and cost guardrails control spend and detect failed schedules.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs>
<style>
  svg { --bg:#ffffff; --sec:#eaeef2; --chip:#ffffff; --border:#afb8c1; --text:#1f2328; --muted:#57606a; --arrow:#57606a;
        --a:#0f766e; --b:#4338ca; --c:#b45309; --d:#7e22ce; --on-accent:#ffffff; }
  @media (prefers-color-scheme: dark) {
    svg { --bg:#0d1117; --sec:#1c2128; --chip:#0d1117; --border:#545d68; --text:#e6edf3; --muted:#9da7b3; --arrow:#9da7b3;
          --a:#5eead4; --b:#a5b4fc; --c:#fcd34d; --d:#d8b4fe; --on-accent:#0d1117; }
  }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: var(--text); }
  .card { fill: var(--bg); stroke: var(--border); stroke-width: 1.5; }
  .sec  { fill: var(--sec); stroke: var(--border); stroke-width: 1.5; }
  .chip { fill: var(--chip); stroke: var(--border); stroke-width: 1.5; }
  .arrow { fill: none; stroke: var(--arrow); stroke-width: 1.8; }
  .ah { fill: var(--arrow); }
  .h { font-size: 15px; font-weight: 700; }
  .sub { font-size: 12.5px; fill: var(--muted); font-style: italic; }
  .ct { font-size: 13px; font-weight: 600; }
  .cb { font-size: 12px; fill: var(--muted); }
  .badge-a { fill: var(--a); } .badge-b { fill: var(--b); } .badge-c { fill: var(--c); } .badge-d { fill: var(--d); }
  .badge-t { font-size: 11px; font-weight: 700; fill: var(--on-accent); }
</style>
<rect x="0.5" y="0.5" width="1039" height="769" rx="16" class="card" />
<rect x="20" y="20" width="1000" height="120" rx="10" class="sec" />
<text x="36" y="42" class="h" text-anchor="start">How a change reaches AWS</text>
<text x="236" y="42" class="sub" text-anchor="start">the same path whether a human or a coding agent makes it</text>
<rect x="36" y="56" width="172" height="70" rx="7" class="chip" />
<text x="46" y="75" class="ct" text-anchor="start">One service at a time</text>
<text x="46" y="92" class="cb" text-anchor="start">module, tests, then</text>
<text x="46" y="108" class="cb" text-anchor="start">one reviewable change</text>
<rect x="235" y="56" width="172" height="70" rx="7" class="chip" />
<text x="245" y="75" class="ct" text-anchor="start">Agent guards</text>
<text x="245" y="92" class="cb" text-anchor="start">hooks block admin creds,</text>
<text x="245" y="108" class="cb" text-anchor="start">guard edits, wrong shell</text>
<path d="M210,91 L232,91" class="arrow" marker-end="url(#ah)" />
<rect x="434" y="56" width="172" height="70" rx="7" class="chip" />
<text x="444" y="75" class="ct" text-anchor="start">Gates</text>
<text x="444" y="92" class="cb" text-anchor="start">ruff · mypy · pytest</text>
<text x="444" y="108" class="cb" text-anchor="start">checkov · gitleaks</text>
<path d="M409,91 L431,91" class="arrow" marker-end="url(#ah)" />
<rect x="633" y="56" width="172" height="70" rx="7" class="chip" />
<text x="643" y="75" class="ct" text-anchor="start">Plan, then apply</text>
<text x="643" y="92" class="cb" text-anchor="start">the diff is read, then</text>
<text x="643" y="108" class="cb" text-anchor="start">exec role + boundary</text>
<path d="M608,91 L630,91" class="arrow" marker-end="url(#ah)" />
<rect x="832" y="56" width="172" height="70" rx="7" class="chip" />
<text x="842" y="75" class="ct" text-anchor="start">Verify on live AWS</text>
<text x="842" y="92" class="cb" text-anchor="start">29 test modules query</text>
<text x="842" y="108" class="cb" text-anchor="start">what was really built</text>
<path d="M807,91 L829,91" class="arrow" marker-end="url(#ah)" />
<rect x="20" y="162" width="1000" height="588" rx="10" class="card" />
<text x="36" y="186" class="h" text-anchor="start">One AWS account</text>
<text x="182" y="186" class="sub" text-anchor="start">environments are isolated by name prefix, tags and separate VPCs</text>
<path d="M520,140 L520,161" class="arrow" marker-end="url(#ah)" />
<rect x="36" y="200" width="724" height="40" rx="7" class="chip" />
<text x="48" y="225" class="ct" text-anchor="start">Operator laptop → SSM port-forward → private hosts</text>
<text x="748" y="225" class="cb" text-anchor="end">no public ingress · no load balancer</text>
<rect x="36" y="252" width="724" height="108" rx="10" class="sec" />
<rect x="48" y="260" width="151" height="20" rx="10" class="badge-a" />
<text x="123.5" y="274" class="badge-t" text-anchor="middle">40-42  Applications</text>
<text x="209" y="274" class="sub" text-anchor="start">their code lives in their own repos</text>
<rect x="48" y="288" width="166" height="62" rx="7" class="chip" />
<text x="58" y="307" class="ct" text-anchor="start">MacroRAG</text>
<text x="58" y="324" class="cb" text-anchor="start">EC2 compose stack</text>
<text x="58" y="340" class="cb" text-anchor="start">S3 corpus, CMK volume</text>
<rect x="226" y="288" width="166" height="62" rx="7" class="chip" />
<text x="236" y="307" class="ct" text-anchor="start">XbrlRag</text>
<text x="236" y="324" class="cb" text-anchor="start">EC2: ui, api, mcp</text>
<text x="236" y="340" class="cb" text-anchor="start">RDS Postgres 16, CMK</text>
<rect x="404" y="288" width="166" height="62" rx="7" class="chip" />
<text x="414" y="307" class="ct" text-anchor="start">Faultline</text>
<text x="414" y="324" class="cb" text-anchor="start">EC2 t4g.large</text>
<text x="414" y="340" class="cb" text-anchor="start">calls both RAG apps</text>
<rect x="582" y="288" width="166" height="62" rx="7" class="chip" />
<text x="592" y="307" class="ct" text-anchor="start">Ingest runner</text>
<text x="592" y="324" class="cb" text-anchor="start">on-demand batch</text>
<text x="592" y="340" class="cb" text-anchor="start">loads RDS and Qdrant</text>
<rect x="36" y="372" width="724" height="108" rx="10" class="sec" />
<rect x="48" y="380" width="151" height="20" rx="10" class="badge-b" />
<text x="123.5" y="394" class="badge-t" text-anchor="middle">30  Shared services</text>
<text x="209" y="394" class="sub" text-anchor="start">one copy serves all three applications</text>
<rect x="48" y="408" width="225" height="62" rx="7" class="chip" />
<text x="58" y="427" class="ct" text-anchor="start">RagInference</text>
<text x="58" y="444" class="cb" text-anchor="start">ECS Fargate, arm64</text>
<text x="58" y="460" class="cb" text-anchor="start">embed and rerank, scales to zero</text>
<rect x="285" y="408" width="225" height="62" rx="7" class="chip" />
<text x="295" y="427" class="ct" text-anchor="start">Qdrant</text>
<text x="295" y="444" class="cb" text-anchor="start">t4g.small, TLS</text>
<text x="295" y="460" class="cb" text-anchor="start">CMK data volume</text>
<rect x="522" y="408" width="225" height="62" rx="7" class="chip" />
<text x="532" y="427" class="ct" text-anchor="start">Service discovery</text>
<text x="532" y="444" class="cb" text-anchor="start">Cloud Map private DNS</text>
<text x="532" y="460" class="cb" text-anchor="start">for service-to-service calls</text>
<rect x="36" y="492" width="724" height="108" rx="10" class="sec" />
<rect x="48" y="500" width="186" height="20" rx="10" class="badge-c" />
<text x="141.0" y="514" class="badge-t" text-anchor="middle">10-20  Data and security</text>
<text x="244" y="514" class="sub" text-anchor="start">encrypted at rest with a customer-managed key</text>
<rect x="48" y="528" width="166" height="62" rx="7" class="chip" />
<text x="58" y="547" class="ct" text-anchor="start">S3 buckets</text>
<text x="58" y="564" class="cb" text-anchor="start">corpus, filings, app</text>
<text x="58" y="580" class="cb" text-anchor="start">data, weights, logs</text>
<rect x="226" y="528" width="166" height="62" rx="7" class="chip" />
<text x="236" y="547" class="ct" text-anchor="start">ECR</text>
<text x="236" y="564" class="cb" text-anchor="start">12 repositories</text>
<text x="236" y="580" class="cb" text-anchor="start">scanned on push</text>
<rect x="404" y="528" width="166" height="62" rx="7" class="chip" />
<text x="414" y="547" class="ct" text-anchor="start">KMS</text>
<text x="414" y="564" class="cb" text-anchor="start">shared CMK</text>
<text x="414" y="580" class="cb" text-anchor="start">S3, EBS, RDS, secrets</text>
<rect x="582" y="528" width="166" height="62" rx="7" class="chip" />
<text x="592" y="547" class="ct" text-anchor="start">Secrets Manager</text>
<text x="592" y="564" class="cb" text-anchor="start">fetched at runtime</text>
<text x="592" y="580" class="cb" text-anchor="start">never in tfvars</text>
<rect x="36" y="612" width="724" height="108" rx="10" class="sec" />
<rect x="48" y="620" width="116" height="20" rx="10" class="badge-d" />
<text x="106.0" y="634" class="badge-t" text-anchor="middle">00  Networking</text>
<text x="174" y="634" class="sub" text-anchor="start">private by default, with free paths preferred</text>
<rect x="48" y="648" width="166" height="62" rx="7" class="chip" />
<text x="58" y="667" class="ct" text-anchor="start">VPC</text>
<text x="58" y="684" class="cb" text-anchor="start">private subnets</text>
<text x="58" y="700" class="cb" text-anchor="start">flow logs on</text>
<rect x="226" y="648" width="166" height="62" rx="7" class="chip" />
<text x="236" y="667" class="ct" text-anchor="start">S3 gateway endpoint</text>
<text x="236" y="684" class="cb" text-anchor="start">free path to S3</text>
<text x="236" y="700" class="cb" text-anchor="start">no NAT charge</text>
<rect x="404" y="648" width="166" height="62" rx="7" class="chip" />
<text x="414" y="667" class="ct" text-anchor="start">NAT instance</text>
<text x="414" y="684" class="cb" text-anchor="start">scheduled, not a</text>
<text x="414" y="700" class="cb" text-anchor="start">24×7 NAT Gateway</text>
<rect x="582" y="648" width="166" height="62" rx="7" class="chip" />
<text x="592" y="667" class="ct" text-anchor="start">Security groups</text>
<text x="592" y="684" class="cb" text-anchor="start">SGs reference SGs</text>
<text x="592" y="700" class="cb" text-anchor="start">wherever possible</text>
<path d="M398,360 L398,371" class="arrow" marker-end="url(#ah)" />
<path d="M398,480 L398,491" class="arrow" marker-end="url(#ah)" />
<path d="M398,600 L398,611" class="arrow" marker-end="url(#ah)" />
<path d="M398,240 L398,251" class="arrow" marker-end="url(#ah)" />
<rect x="776" y="200" width="228" height="532" rx="10" class="sec" />
<text x="788" y="224" class="h" text-anchor="start">Spend and detection</text>
<rect x="788" y="242" width="204" height="84" rx="7" class="chip" />
<text x="798" y="261" class="ct" text-anchor="start">Daily windows</text>
<text x="798" y="278" class="cb" text-anchor="start">EventBridge Scheduler starts</text>
<text x="798" y="294" class="cb" text-anchor="start">and stops every tier</text>
<rect x="788" y="338" width="204" height="84" rx="7" class="chip" />
<text x="798" y="357" class="ct" text-anchor="start">Park mode</text>
<text x="798" y="374" class="cb" text-anchor="start">one flag holds it all off:</text>
<text x="798" y="390" class="cb" text-anchor="start">about $4 to $0.68 a day</text>
<rect x="788" y="434" width="204" height="84" rx="7" class="chip" />
<text x="798" y="453" class="ct" text-anchor="start">Scheduler alarms</text>
<text x="798" y="470" class="cb" text-anchor="start">a failed start or stop</text>
<text x="798" y="486" class="cb" text-anchor="start">publishes to SNS</text>
<rect x="788" y="530" width="204" height="84" rx="7" class="chip" />
<text x="798" y="549" class="ct" text-anchor="start">Cost guardrails</text>
<text x="798" y="566" class="cb" text-anchor="start">account budget and</text>
<text x="798" y="582" class="cb" text-anchor="start">anomaly detection</text>
<rect x="788" y="626" width="204" height="84" rx="7" class="chip" />
<text x="798" y="645" class="ct" text-anchor="start">Remote state</text>
<text x="798" y="662" class="cb" text-anchor="start">one S3 key per component</text>
<text x="798" y="678" class="cb" text-anchor="start">S3-native locking</text>
</svg>
